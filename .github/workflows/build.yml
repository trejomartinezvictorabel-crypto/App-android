name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true
      - run: flutter create . --org com.albanil.app --project-name navegacion_offline_mx --platforms=android
      
      - name: Inyectar SDK y MinSDK Correcto con Python
        run: |
          python3 -c "
          import os

          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()
              
              # Reemplazos directos y seguros para minSdkVersion y SDKs
              # Reemplaza cualquier versión mínima por 24 de forma absoluta
              if 'minSdkVersion' in content:
                  import re
                  content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)
              else:
                  # Si no existe, lo inyecta dentro de defaultConfig
                  content = content.replace('defaultConfig {', 'defaultConfig {\n        minSdkVersion 24')

              if 'targetSdkVersion' in content:
                  import re
                  content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 36', content)
              
              if 'compileSdkVersion' in content:
                  import re
                  content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 36', content)

              with open(gradle_path, 'w') as f:
                  f.write(content)
              print('build.gradle parcheado con éxito a minSDK 24 y SDK 36.')

          # 2. Agregar permisos en AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  manifest = f.read()
              
              permisos = '''
                  <uses-permission android:name=\"android.permission.INTERNET\"/>
                  <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
                  <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
                  <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
                  <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
              '''
              if '<application' in manifest and 'ACCESS_FINE_LOCATION' not in manifest:
                  manifest = manifest.replace('<application', permisos + '\n    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(manifest)
          "

      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-navegacion-apk
          path: build/app/outputs/flutter-apk/app-debug.apk 
