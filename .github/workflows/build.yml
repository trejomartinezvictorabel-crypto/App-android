name: Compilar APK Android 16

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x gradlew || echo "No gradlew found yet"

    - name: Compilar APK de depuración (Debug)
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "Falta el archivo gradlew en el repositorio"
          exit 1
        fi

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
defaults:
  
