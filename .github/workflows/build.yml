name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true
      
      - name: Corregir pubspec.yaml, Kotlin, SDK y Permisos con Python
        run: |
          python3 -c "
          import os

          # 1. Asegurar un pubspec.yaml válido con todas las dependencias
          pubspec_content = '''name: navegacion_offline_mx
          description: Navegación multimodal offline para trabajo de campo en México.
          publish_to: \"none\"
          version: 1.0.0+1

          environment:
            sdk: \">=3.3.0 <4.0.0\"

          dependencies:
            flutter:
              sdk: flutter
            flutter_map: ^6.2.1
            latlong2: ^0.9.1
            geolocator: ^12.0.0
            flutter_tts: ^4.0.2
            speech_to_text: ^7.0.0
            sqflite: ^2.3.3+1
            path: ^1.9.0
            path_provider: ^2.1.4
            file_picker: ^8.1.2
            permission_handler: ^11.3.1
            wakelock_plus: ^1.2.8
            flutter_compass: ^0.8.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          '''
          with open('pubspec.yaml', 'w') as f:
              f.write(pubspec_content)

          # 2. Actualizar la versión de Kotlin a 2.1.0 en android/settings.gradle
          settings_path = 'android/settings.gradle'
          if os.path.exists(settings_path):
              with open(settings_path, 'r') as f:
                  lines = f.readlines()
              
              new_settings = []
              for line in lines:
                  if 'org.jetbrains.kotlin.android' in line:
                      new_settings.append('    id \"org.jetbrains.kotlin.android\" version \"2.1.0\" apply false\n')
                  else:
                      new_settings.append(line)
              
              with open(settings_path, 'w') as f:
                  f.writelines(new_settings)

          # 3. Forzar SDK 36 y MinSDK 24 en android/app/build.gradle
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  lines = f.readlines()

              new_lines = []
              for line in lines:
                  if 'compileSdkVersion' in line:
                      new_lines.append('    compileSdkVersion 36\n')
                  elif 'targetSdkVersion' in line:
                      new_lines.append('        targetSdkVersion 36\n')
                  elif 'minSdkVersion' in line:
                      new_lines.append('        minSdkVersion 24\n')
                  else:
                      new_lines.append(line)

              with open(gradle_path, 'w') as f:
                  f.writelines(new_lines)

          # 4. Agregar permisos en AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  manifest = f.read()
              
              permisos = '''
                  <uses-permission android:name=\"android.permission.INTERNET\"/>
                  <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
                  <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
                  <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>
                  <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_LOCATION\"/>
                  <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
                  <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
                  <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
                  <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\"/>
                  <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\"/>
                  <queries>
                      <intent><action android:name=\"android.intent.action.TTS_SERVICE\"/></intent>
                      <intent><action android:name=\"android.speech.RecognitionService\"/></intent>
                  </queries>
              '''
              if '<application' in manifest and 'ACCESS_FINE_LOCATION' not in manifest:
                  manifest = manifest.replace('<application', permisos + '\n    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(manifest)
          "

      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-navegacion-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
