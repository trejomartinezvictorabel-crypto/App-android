name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true
      - run: flutter create . --org com.albanil.app --project-name app_android --platforms=android
      - name: Ajustar SDK 35 con Python
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
          content = content.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 35')
          with open(path, 'w') as f:
              f.write(content)
          "
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-albanileria-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          name: navegacion_offline_mx
description: Navegación multimodal offline para trabajo de campo en México.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
